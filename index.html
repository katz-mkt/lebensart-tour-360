  :root{
    --ink:#0B0F14;
    --ink-2:#131A22;
    --paper:#EDF1F5;
    --haze:#8B99A8;
    --brass:#B9C2CC;
    --line:rgba(237,241,245,.14);
    --shadow:0 18px 50px rgba(0,0,0,.55);
    --sans:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}

  /* ---- vinhetas para o texto respirar sobre a foto ---- */
  .veil{position:absolute;left:0;right:0;pointer-events:none}
  .veil-top{top:0;height:190px;background:linear-gradient(180deg,rgba(11,15,20,.72),rgba(11,15,20,0))}
  .veil-bottom{bottom:0;height:150px;background:linear-gradient(0deg,rgba(11,15,20,.62),rgba(11,15,20,0))}

  /* ---- identidade ---- */
  .brand{position:absolute;top:26px;left:30px;pointer-events:none}
  .eyebrow{
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--brass);font-weight:600;margin:0 0 8px
  }
  .wordmark{font-family:var(--serif);font-size:23px;letter-spacing:.2em;text-transform:uppercase;margin:0;font-weight:600}
  .sub{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--haze);margin:7px 0 0}

  /* ---- titulo do andar ---- */
  .readout{position:absolute;left:30px;bottom:30px;pointer-events:none}
  .floor-title{
    font-family:var(--serif);font-weight:300;letter-spacing:-.01em;
    font-size:clamp(34px,6.2vw,62px);line-height:.95;margin:0;
    text-shadow:0 2px 26px rgba(0,0,0,.6);
  }
  .floor-meta{
    display:flex;gap:16px;align-items:baseline;margin:12px 0 0;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);
    font-variant-numeric:tabular-nums;
  }
  .floor-meta b{color:var(--paper);font-weight:600}
  .floor-meta .dot{color:var(--line)}

  /* ---- trilho de elevador ---- */
  .rail{
    position:absolute;right:30px;top:50%;transform:translateY(-50%);
    height:min(66vh,560px);width:104px;
  }
  .rail-line{
    position:absolute;left:15px;top:0;bottom:0;width:1px;background:var(--line);
  }
  .rail-fill{
    position:absolute;left:15px;width:1px;background:linear-gradient(180deg,var(--brass),rgba(185,194,204,.15));
    transition:top .5s cubic-bezier(.4,0,.2,1),bottom .5s cubic-bezier(.4,0,.2,1);
  }
  .stop{
    position:absolute;left:0;transform:translateY(-50%);
    display:flex;align-items:center;gap:11px;
    background:none;border:0;padding:5px 6px;margin:0;
    color:var(--haze);cursor:pointer;width:100%;text-align:left;
    font-family:var(--sans);font-size:11px;letter-spacing:.09em;
    font-variant-numeric:tabular-nums;
    border-radius:6px;
    transition:color .25s ease;
  }
  .stop .tick{width:11px;height:1px;background:currentColor;flex:0 0 auto;margin-left:10px;transition:width .25s ease,margin-left .25s ease}
  .stop .lbl{opacity:.72;transition:opacity .25s ease}
  .stop:hover{color:var(--paper)}
  .stop:hover .tick{width:19px;margin-left:2px}
  .stop:focus-visible{outline:1px solid var(--brass);outline-offset:2px}
  .stop[aria-current="true"]{color:var(--brass)}
  .stop[aria-current="true"] .tick{width:23px;margin-left:0;height:1px}
  .stop[aria-current="true"] .lbl{opacity:1;font-weight:600}
  .rail-cap{
    position:absolute;right:0;font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--haze);opacity:.55;
  }
  .rail-cap.top{top:-24px}
  .rail-cap.bot{bottom:-24px}

  /* ---- controles ---- */
  .tools{position:absolute;right:30px;bottom:30px;display:flex;gap:8px}
  .tool{
    width:38px;height:38px;display:grid;place-items:center;
    background:rgba(19,26,34,.6);border:1px solid var(--line);border-radius:9px;
    color:var(--paper);cursor:pointer;backdrop-filter:blur(9px);
    transition:background .2s ease,border-color .2s ease;
  }
  .tool:hover{background:rgba(19,26,34,.92);border-color:rgba(185,194,204,.5)}
  .tool:focus-visible{outline:1px solid var(--brass);outline-offset:2px}
  .tool[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
  .tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  .hint{
    position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--haze);
    pointer-events:none;opacity:.75;transition:opacity .6s ease;white-space:nowrap;
  }
  .hint.gone{opacity:0}

  /* ---- carregamento ---- */
  #boot{
    position:absolute;inset:0;background:var(--ink);display:grid;place-items:center;
    z-index:20;transition:opacity .7s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  .boot-in{text-align:center}
  .boot-bar{width:190px;height:1px;background:var(--line);margin:20px auto 0;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s ease}
  .spin{
    position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    border:1px solid var(--line);border-top-color:var(--brass);border-radius:50%;
    animation:spin .8s linear infinite;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:5;
  }
  .spin.on{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    .brand{top:18px;left:18px}
    .wordmark{font-size:20px}
    .readout{left:18px;bottom:22px}
    .rail{right:14px;width:74px;height:min(60vh,460px)}
    .stop{font-size:10px;gap:7px}
    .tools{right:14px;bottom:22px}
    .hint{display:none}
    .veil-top{height:140px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  }
</style>
</head>

      <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/></svg>
    </button>
    <button class="tool" id="btnFs" title="Tela cheia" aria-label="Tela cheia">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
    </button>
  </div>

  <p class="hint" id="hint">Arraste para olhar &#183; Role para aproximar &#183; &#8593; &#8595; troca de andar</p>

  <div id="boot">
    <div class="boot-in">
      <p class="eyebrow">Tour 360</p>
      <h1 class="wordmark">Lebensart</h1>
      <div class="boot-bar"><i id="bootbar"></i></div>
    </div>
  </div>
</div>

<script>
/* ---------------------------------------------------------------
   Panor\u00e2micas equirretangulares, uma por andar, na ordem de subida
   do drone (altitude relativa crescente, ~3 m entre andares).
--------------------------------------------------------------- */
const PANOS = [
{floor:2,alt:8.8,src:"img/andar-01.webp"},
{floor:3,alt:10.6,src:"img/andar-02.webp"},
{floor:4,alt:13.9,src:"img/andar-03.webp"},
{floor:5,alt:17.3,src:"img/andar-04.webp"},
{floor:6,alt:20.0,src:"img/andar-05.webp"},
{floor:7,alt:23.3,src:"img/andar-06.webp"},
{floor:8,alt:25.8,src:"img/andar-07.webp"},
{floor:9,alt:28.8,src:"img/andar-08.webp"},
{floor:10,alt:31.9,src:"img/andar-09.webp"},
{floor:11,alt:35.0,src:"img/andar-10.webp"},
{floor:12,alt:37.8,src:"img/andar-11.webp"},
{floor:13,alt:41.2,src:"img/andar-12.webp"},
{floor:14,alt:44.1,src:"img/andar-13.webp"},
{floor:15,alt:46.9,src:"img/andar-14.webp"},
{floor:16,alt:49.7,src:"img/andar-15.webp"},
{floor:17,alt:53.8,src:"img/andar-16.webp"}
];

const $ = (id) => document.getElementById(id);
const canvas = $('gl');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});

if (!gl) {
  $('boot').innerHTML = '<div class="boot-in"><p class="eyebrow">Sem suporte</p>' +
    '<p style="color:var(--haze);font-size:13px;max-width:320px;line-height:1.6">' +
    'Este navegador n\u00e3o tem WebGL dispon\u00edvel. Abra o tour no Chrome, Edge ou Safari atualizados.</p></div>';
  throw new Error('sem webgl');
}

/* ---------------- shaders: tra\u00e7ado de raio equirretangular ---------------- */
const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos,0.,1.); }`;

const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uFov, uYaw, uPitch, uMix;
uniform sampler2D uA, uB;
const float PI = 3.141592653589793;
void main(){
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  float t = tan(uFov * 0.5);
  vec3 d = normalize(vec3(ndc.x * t * (uRes.x / uRes.y), ndc.y * t, -1.0));
  float cp = cos(uPitch), sp = sin(uPitch);
  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);
  // -d.x: varrer a tela da esquerda para a direita precisa aumentar u,
  // senao o panorama sai espelhado horizontalmente.
  vec2 uv = vec2(atan(-d.x, d.z) / (2.0 * PI) + 0.5,
                 acos(clamp(d.y, -1.0, 1.0)) / PI);
  gl_FragColor = mix(texture2D(uA, uv), texture2D(uB, uv), uMix);
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uFov','uYaw','uPitch','uMix','uA','uB'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.uniform1i(U.uA, 0);
gl.uniform1i(U.uB, 1);

/* ---------------- cache de texturas (mant\u00e9m poucas na GPU) ---------------- */
const texCache = new Map();   // \u00edndice -> {tex, used}
const loading  = new Map();   // \u00edndice -> Promise
const MAX_TEX  = 4;
let clock = 0;

function makeTexture(img){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function evict(keep){
  if (texCache.size <= MAX_TEX) return;
  const ordered = [...texCache.entries()].sort((a,b) => a[1].used - b[1].used);
  for (const [i, rec] of ordered){
    if (texCache.size <= MAX_TEX) break;
    if (keep.includes(i)) continue;
    gl.deleteTexture(rec.tex);
    texCache.delete(i);
  }
}

function load(i){
  if (texCache.has(i)){ texCache.get(i).used = ++clock; return Promise.resolve(texCache.get(i).tex); }
  if (loading.has(i)) return loading.get(i);
  const p = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const t = makeTexture(img); texCache.set(i, {tex:t, used:++clock}); loading.delete(i); res(t); };
    img.onerror = () => { loading.delete(i); rej(new Error('falha ao carregar andar ' + i)); };
    img.src = PANOS[i].src;
  });
  loading.set(i, p);
  return p;
}

/* ---------------- estado da c\u00e2mera ---------------- */
let yaw = 0, pitch = 0, fov = 1.15;        // radianos
let cur = 0, texA = null, texB = null, mix = 1;
let texAIdx = -1, texBIdx = -1;   // andares que estao de fato na GPU agora
let fading = false, autoRot = false, interacted = false;
const FOV_MIN = 0.55, FOV_MAX = 1.75, PITCH_MAX = 1.48;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

let last = 0;
function frame(now){
  const dt = last ? Math.min((now - last) / 1000, .05) : 0;
  last = now;
  if (autoRot && !dragging) yaw -= dt * 0.055;   // avanca para a direita na foto
  if (fading){
    mix = Math.min(1, mix + dt * 1.9);
    if (mix >= 1){ fading = false; texA = texB; texAIdx = texBIdx; }
  }
  resize();
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uFov, fov);
  gl.uniform1f(U.uYaw, yaw);
  gl.uniform1f(U.uPitch, pitch);
  gl.uniform1f(U.uMix, mix);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA || texB);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texB || texA);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

/* ---------------- navega\u00e7\u00e3o entre andares ---------------- */
const stops = [];
const alts = PANOS.map(p => p.alt);
const aMin = Math.min(...alts), aMax = Math.max(...alts);
const posOf = (alt) => (1 - (alt - aMin) / (aMax - aMin)) * 100;   // 0% = topo

PANOS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'stop';
  b.style.top = posOf(p.alt) + '%';
  b.type = 'button';
  b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
  b.innerHTML = '<span class="lbl">' + p.floor + '\u00ba</span><span class="tick"></span>';
  b.title = p.floor + '\u00ba andar \u00b7 ' + p.alt.toFixed(1).replace('.', ',') + ' m';
  b.addEventListener('click', () => go(i));
  $('rail').appendChild(b);
  stops.push(b);
});

function go(i){
  i = Math.max(0, Math.min(PANOS.length - 1, i));
  if (i === cur && texA) return;
  const prev = cur;          // preserva a textura de sa\u00edda enquanto o cross-fade roda
  cur = i;
  const p = PANOS[i];

  $('ftitle').textContent = p.floor + '\u00ba andar';
  $('falt').textContent = p.alt.toFixed(1).replace('.', ',') + ' m';
  $('fidx').textContent = String(i + 1).padStart(2, '0') + ' de ' + PANOS.length;
  document.title = p.floor + '\u00ba andar \u2014 Lebensart Tour 360';
  stops.forEach((s, k) => s.setAttribute('aria-current', k === i ? 'true' : 'false'));
  $('railfill').style.top = posOf(p.alt) + '%';
  $('railfill').style.bottom = '0%';

  const ready = texCache.has(i);
  if (!ready) $('spin').classList.add('on');

  load(i).then(t => {
    if (cur !== i) return;
    $('spin').classList.remove('on');
    if (!texA){ texA = t; texB = t; texAIdx = texBIdx = i; mix = 1; }
    else { texB = t; texBIdx = i; mix = 0; fading = true; }
    // nunca descarta o que esta ligado agora, mesmo com trocas em cima da transicao
    evict([i, prev, texAIdx, texBIdx, i-1, i+1]);
    // adianta os vizinhos para a troca ficar instant\u00e2nea
    [i+1, i-1].forEach(j => { if (PANOS[j] && !texCache.has(j)) load(j).catch(()=>{}); });
  }).catch(() => {
    $('spin').classList.remove('on');
  });
}

/* ---------------- intera\u00e7\u00e3o ---------------- */
let dragging = false, px = 0, py = 0, pinch = 0;

function markInteracted(){
  if (interacted) return;
  interacted = true;
  $('hint').classList.add('gone');
}

canvas.addEventListener('pointerdown', e => {
  dragging = true; px = e.clientX; py = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  markInteracted();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = fov / canvas.clientHeight * 1.15;
  // "puxar a cena": a imagem acompanha o dedo, entao a camera gira ao contrario
  yaw   += (e.clientX - px) * k;
  pitch += (e.clientY - py) * k;
  pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, pitch));
  px = e.clientX; py = e.clientY;
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov + e.deltaY * 0.0013));
  markInteracted();
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const d = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov * (pinch / d)));
  pinch = d;
}, {passive:false});
canvas.addEventListener('touchend', () => { pinch = 0; });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')        { go(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { go(cur - 1); e.preventDefault(); }
  // setas giram a camera (seta esquerda olha para a esquerda), ao contrario do drag
  else if (e.key === 'ArrowLeft') { yaw += 0.09; markInteracted(); }
  else if (e.key === 'ArrowRight'){ yaw -= 0.09; markInteracted(); }
  else return;
});

$('btnRot').addEventListener('click', e => {
  autoRot = !autoRot;
  e.currentTarget.setAttribute('aria-pressed', String(autoRot));
  markInteracted();
});
$('btnFs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('stage').requestFullscreen?.();
});

/* ---------------- in\u00edcio ---------------- */
$('bootbar').style.width = '18%';
load(0).then(() => {
  $('bootbar').style.width = '100%';
  go(0);            // go() assume a primeira textura e sincroniza t\u00edtulo e trilho
  requestAnimationFrame(frame);
  setTimeout(() => $('boot').classList.add('gone'), 320);
  setTimeout(() => { if (!interacted) $('hint').classList.add('gone'); }, 9000);
  load(1).catch(()=>{});
}).catch(() => {
  $('bootbar').style.background = '#B4472F';
});
</script>

</body>
</html>
