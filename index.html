  :root{
    --ink:#0B0F14;
    --ink-2:#131A22;
    --paper:#EDF1F5;
    --haze:#8B99A8;
    --brass:#B9C2CC;
    --line:rgba(237,241,245,.14);
    --shadow:0 18px 50px rgba(0,0,0,.55);
    --th:clamp(110px,15vh,150px);   /* altura do icone do predio (canto inferior direito) */
    --sans:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:'Montserrat',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--ink);color:var(--paper);
    font-family:var(--sans);overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #gl.dragging{cursor:grabbing}

  /* ---- vinhetas para o texto respirar sobre a foto ---- */
  .veil{position:absolute;left:0;right:0;pointer-events:none}
  .veil-top{top:0;height:190px;background:linear-gradient(180deg,rgba(11,15,20,.72),rgba(11,15,20,0))}
  .veil-bottom{bottom:0;height:150px;background:linear-gradient(0deg,rgba(11,15,20,.62),rgba(11,15,20,0))}

  /* ---- identidade ---- */
  .brand{position:absolute;top:26px;left:30px;pointer-events:none}
  .eyebrow{
    font-size:10px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--brass);font-weight:600;margin:0 0 8px
  }
  .wordmark{font-family:var(--serif);font-size:23px;letter-spacing:.2em;text-transform:uppercase;margin:0;font-weight:600}
  .sub{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--haze);margin:7px 0 0}

  /* ---- titulo do andar ---- */
  .readout{position:absolute;left:30px;bottom:30px;pointer-events:none}
  .floor-title{
    font-family:var(--serif);font-weight:300;letter-spacing:-.01em;
    font-size:clamp(34px,6.2vw,62px);line-height:.95;margin:0;
    text-shadow:0 2px 26px rgba(0,0,0,.6);
  }
  .floor-meta{
    display:flex;gap:16px;align-items:baseline;margin:12px 0 0;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--haze);
    font-variant-numeric:tabular-nums;
  }
  .floor-meta b{color:var(--paper);font-weight:600}
  .floor-meta .dot{color:var(--line)}

  /* ---- trilho de elevador ---- */
  .rail{
    position:absolute;right:30px;top:calc(50% - 36px);transform:translateY(-50%);
    height:min(62vh,540px);width:128px;
  }
  /* painel de vidro atras do trilho: garante contraste do texto contra
     qualquer trecho da foto (ceu claro, fachada clara, etc.) */
  .rail::before{
    content:'';position:absolute;left:-14px;right:-14px;top:-46px;bottom:-14px;
    background:rgba(11,15,20,.46);border:1px solid rgba(237,241,245,.09);
    border-radius:18px;backdrop-filter:blur(11px);pointer-events:none;
  }
  .rail-cap{
    position:absolute;right:4px;top:-30px;
    font-size:10px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;
    color:var(--paper);opacity:.6;
  }
  .rail-line{
    position:absolute;left:19px;top:0;bottom:0;width:1px;background:rgba(237,241,245,.24);
  }
  .rail-fill{
    position:absolute;left:19px;width:2px;margin-left:-.5px;background:linear-gradient(180deg,var(--brass),rgba(185,194,204,.18));
    transition:top .5s cubic-bezier(.4,0,.2,1),bottom .5s cubic-bezier(.4,0,.2,1);
  }
  .stop{
    position:absolute;left:0;transform:translateY(-50%);
    display:flex;align-items:center;gap:11px;
    background:none;border:0;padding:6px 8px;margin:0;
    color:var(--paper);cursor:pointer;width:100%;text-align:left;
    font-family:var(--sans);font-size:13px;font-weight:500;letter-spacing:.06em;
    font-variant-numeric:tabular-nums;
    border-radius:8px;
    transition:color .2s ease,background-color .2s ease;
  }
  .stop .tick{width:12px;height:2px;border-radius:1px;background:currentColor;flex:0 0 auto;margin-left:9px;transition:width .2s ease,margin-left .2s ease,background-color .2s ease}
  .stop .lbl{opacity:.66;transition:opacity .2s ease}
  .stop:hover{background:rgba(237,241,245,.09)}
  .stop:hover .lbl{opacity:.95}
  .stop:hover .tick{width:20px;margin-left:1px}
  .stop:focus-visible{outline:1px solid var(--paper);outline-offset:2px}
  .stop[aria-current="true"]{background:rgba(237,241,245,.15);font-weight:700}
  .stop[aria-current="true"] .tick{width:26px;margin-left:0;height:2px;background:var(--brass)}
  .stop[aria-current="true"] .lbl{opacity:1}

  /* ---- predio: posicao do andar (so tracos, sem fundo) ---- */
  .tower{
    position:absolute;right:30px;bottom:30px;
    height:var(--th);aspect-ratio:0.4301;pointer-events:none;overflow:visible;
    filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));
  }
  .tower path{fill:none;vector-effect:non-scaling-stroke;stroke-linecap:round;stroke-linejoin:round}
  .tower .t-slab{stroke:var(--paper);stroke-width:1;opacity:.52;transition:opacity .4s ease}
  .tower .t-out{stroke:var(--paper);stroke-width:1.25;opacity:.85;transition:opacity .4s ease}
  .tower .t-band{fill:#FFD21F;fill-opacity:.94;stroke:none;transition:opacity .35s ease}
  .tower.all .t-band{opacity:0}
  .tower.all .t-slab{opacity:.8}
  .tower.all .t-out{opacity:.95}

  /* ---- controles ---- */
  .tools{position:absolute;right:calc(30px + var(--th) * 0.4301 + 16px);bottom:30px;display:flex;gap:8px}
  .tool{
    width:38px;height:38px;display:grid;place-items:center;
    background:rgba(19,26,34,.6);border:1px solid var(--line);border-radius:9px;
    color:var(--paper);cursor:pointer;backdrop-filter:blur(9px);
    transition:background .2s ease,border-color .2s ease;
  }
  .tool:hover{background:rgba(19,26,34,.92);border-color:rgba(185,194,204,.5)}
  .tool:focus-visible{outline:1px solid var(--brass);outline-offset:2px}
  .tool[aria-pressed="true"]{border-color:var(--brass);color:var(--brass)}
  .tool svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

  .hint{
    position:absolute;left:50%;bottom:34px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--haze);
    pointer-events:none;opacity:.75;transition:opacity .6s ease;white-space:nowrap;
  }
  .hint.gone{opacity:0}

  /* ---- carregamento ---- */
  #boot{
    position:absolute;inset:0;background:var(--ink);display:grid;place-items:center;
    z-index:20;transition:opacity .7s ease;
  }
  #boot.gone{opacity:0;pointer-events:none}
  .boot-in{text-align:center}
  .boot-bar{width:190px;height:1px;background:var(--line);margin:20px auto 0;overflow:hidden}
  .boot-bar i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s ease}
  .spin{
    position:absolute;top:50%;left:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
    border:1px solid var(--line);border-top-color:var(--brass);border-radius:50%;
    animation:spin .8s linear infinite;opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:5;
  }
  .spin.on{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:820px){
    .brand{top:18px;left:18px}
    .wordmark{font-size:20px}

/* ---- predio: acende o pavimento escolhido; o resto fica em traco fino e apagado ---- */
const fmtAlt = (a) => (Number.isInteger(a) ? String(a) : a.toFixed(1).replace('.', ',')) + ' m';   // altura exibida
const towerEl = document.getElementById('tower'), tBand = document.getElementById('tband');
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
let tPts = null, tAnim = 0, tWasAll = false;
function tDraw(pts){
  let s = 'M';
  for (let i = 0; i < pts.length; i += 2) s += (i ? 'L' : '') + pts[i].toFixed(1) + ' ' + pts[i + 1].toFixed(1);
  tBand.setAttribute('d', s + 'Z');
}
function towerShow(lvl){
  const all = lvl === 'a';                       // vista aerea: predio inteiro, sem destaque
  towerEl.classList.toggle('all', all);
  if (all) { tWasAll = true; return; }
  const to = lvl === 'r' ? TOWER.r : TOWER.f[lvl];
  if (!to) return;
  if (!tPts || tWasAll || reduceMotion) { cancelAnimationFrame(tAnim); tPts = to.slice(); tDraw(tPts); tWasAll = false; return; }
  const from = tPts.slice(), t0 = performance.now(), dur = 520;
  cancelAnimationFrame(tAnim);
  const step = (now) => {
    let k = Math.min(1, (now - t0) / dur);
    k = 1 - Math.pow(1 - k, 3);
    for (let i = 0; i < to.length; i++) tPts[i] = from[i] + (to[i] - from[i]) * k;
    tDraw(tPts);
    if (k < 1) tAnim = requestAnimationFrame(step);
  };
  tAnim = requestAnimationFrame(step);
}

const $ = (id) => document.getElementById(id);
const canvas = $('gl');
const gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'});

if (!gl) {
  $('boot').innerHTML = '<div class="boot-in"><p class="eyebrow">Sem suporte</p>' +
    '<p style="color:var(--haze);font-size:13px;max-width:320px;line-height:1.6">' +
    'Este navegador n\u00e3o tem WebGL dispon\u00edvel. Abra o tour no Chrome, Edge ou Safari atualizados.</p></div>';
  throw new Error('sem webgl');
}

/* ---------------- shaders: tra\u00e7ado de raio equirretangular ---------------- */
const VS = `
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos,0.,1.); }`;

const FS = `
precision highp float;
uniform vec2 uRes;
uniform float uFov, uYaw, uPitch, uMix;
uniform sampler2D uA, uB, uOv;
uniform mat3 uOvM;                 // direcao do mundo -> coordenada do mapa de implantacao
uniform float uOvA, uOvB;          // 1 quando a foto A / B e a vista aerea
const float PI = 3.141592653589793;
void main(){
  vec2 ndc = (gl_FragCoord.xy / uRes) * 2.0 - 1.0;
  float t = tan(uFov * 0.5);
  vec3 d = normalize(vec3(ndc.x * t * (uRes.x / uRes.y), ndc.y * t, -1.0));
  float cp = cos(uPitch), sp = sin(uPitch);
  d = vec3(d.x, d.y * cp - d.z * sp, d.y * sp + d.z * cp);
  float cy = cos(uYaw), sy = sin(uYaw);
  d = vec3(d.x * cy + d.z * sy, d.y, -d.x * sy + d.z * cy);
  // -d.x: varrer a tela da esquerda para a direita precisa aumentar u,
  // senao o panorama sai espelhado horizontalmente.
  vec2 uv = vec2(atan(-d.x, d.z) / (2.0 * PI) + 0.5,
                 acos(clamp(d.y, -1.0, 1.0)) / PI);
  vec4 col = mix(texture2D(uA, uv), texture2D(uB, uv), uMix);
  // implantacao do predio no terreno: textura ancorada no mundo (projecao do plano do terreno)
  float ow = mix(uOvA, uOvB, uMix);
  vec3 q = uOvM * d;
  vec2 m = q.xy / (abs(q.z) > 1e-5 ? q.z : 1.0);
  vec4 o = texture2D(uOv, m);        // amostra fora de condicional (mipmap correto); pre-multiplicada
  float inside = step(1e-5, q.z) * step(0.0, m.x) * step(m.x, 1.0) * step(0.0, m.y) * step(m.y, 1.0);
  col.rgb = col.rgb * (1.0 - o.a * ow * inside) + o.rgb * ow * inside;
  gl_FragColor = col;
}`;

function compile(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const U = {};
['uRes','uFov','uYaw','uPitch','uMix','uA','uB','uOv','uOvM','uOvA','uOvB'].forEach(n => U[n] = gl.getUniformLocation(prog, n));
gl.uniform1i(U.uA, 0);
gl.uniform1i(U.uB, 1);
gl.uniform1i(U.uOv, 2);
gl.uniformMatrix3fv(U.uOvM, false, new Float32Array(OVERLAY.m));

/* ---- implantacao do predio no terreno: textura (potencia de dois, com mipmaps) ancorada no mundo ---- */
let ovTex = null, ovReady = false;
(function(){
  const im = new Image();
  im.onload = () => {
    const tx = gl.createTexture();
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, tx);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const ext = gl.getExtension('EXT_texture_filter_anisotropic');
    if (ext) gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
    ovTex = tx; ovReady = true;
  };
  im.src = OVERLAY.src;
})();

/* ---------------- cache de texturas (mant\u00e9m poucas na GPU) ---------------- */
const texCache = new Map();   // \u00edndice -> {tex, used}
const loading  = new Map();   // \u00edndice -> Promise
const MAX_TEX  = 4;
let clock = 0;

function makeTexture(img){
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, img);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  return t;
}

function evict(keep){
  if (texCache.size <= MAX_TEX) return;
  const ordered = [...texCache.entries()].sort((a,b) => a[1].used - b[1].used);
  for (const [i, rec] of ordered){
    if (texCache.size <= MAX_TEX) break;
    if (keep.includes(i)) continue;
    gl.deleteTexture(rec.tex);
    texCache.delete(i);
  }
}

function load(i){
  if (texCache.has(i)){ texCache.get(i).used = ++clock; return Promise.resolve(texCache.get(i).tex); }
  if (loading.has(i)) return loading.get(i);
  const p = new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const t = makeTexture(img); texCache.set(i, {tex:t, used:++clock}); loading.delete(i); res(t); };
    img.onerror = () => { loading.delete(i); rej(new Error('falha ao carregar andar ' + i)); };
    img.src = PANOS[i].src;
  });
  loading.set(i, p);
  return p;
}

/* ---------------- estado da c\u00e2mera ---------------- */
let yaw = 0, pitch = 0, fov = 1.15;        // radianos
let cur = 0, texA = null, texB = null, mix = 1;
let texAIdx = -1, texBIdx = -1;   // andares que estao de fato na GPU agora
let fading = false, autoRot = false, interacted = false;
const FOV_MIN = 0.55, FOV_MAX = 1.75, PITCH_MAX = 1.48;

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.round(canvas.clientWidth * dpr);
  const h = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h){
    canvas.width = w; canvas.height = h;
    gl.viewport(0, 0, w, h);
  }
}

let last = 0;
function frame(now){
  const dt = last ? Math.min((now - last) / 1000, .05) : 0;
  last = now;
  if (autoRot && !dragging) yaw -= dt * 0.055;   // avanca para a direita na foto
  if (fading){
    mix = Math.min(1, mix + dt * 1.9);
    if (mix >= 1){ fading = false; texA = texB; texAIdx = texBIdx; }
  }
  resize();
  gl.uniform2f(U.uRes, canvas.width, canvas.height);
  gl.uniform1f(U.uFov, fov);
  gl.uniform1f(U.uYaw, yaw);
  gl.uniform1f(U.uPitch, pitch);
  gl.uniform1f(U.uMix, mix);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texA || texB);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texB || texA);
  const ovOn = (i) => (ovReady && PANOS[i] && PANOS[i].lvl === "a") ? 1 : 0;
  gl.uniform1f(U.uOvA, ovOn(texAIdx)); gl.uniform1f(U.uOvB, ovOn(texBIdx));
  if (ovTex){ gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, ovTex); }
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

/* ---------------- navega\u00e7\u00e3o entre andares ---------------- */
const stops = [];
const posOf = (i) => (1 - i / (PANOS.length - 1)) * 100;   // 0% = topo, espacamento uniforme

PANOS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className = 'stop';
  b.style.top = posOf(i) + '%';
  b.type = 'button';
  b.setAttribute('aria-current', i === 0 ? 'true' : 'false');
  b.innerHTML = '<span class="lbl">' + p.lbl + '</span><span class="tick"></span>';
  b.title = p.title + ' \u00b7 ' + fmtAlt(p.alt);
  b.addEventListener('click', () => go(i));
  $('rail').appendChild(b);
  stops.push(b);
});

function go(i){
  i = Math.max(0, Math.min(PANOS.length - 1, i));
  if (i === cur && texA) return;
  const prev = cur;          // preserva a textura de sa\u00edda enquanto o cross-fade roda
  cur = i;
  const p = PANOS[i];

  $('ftitle').textContent = p.title;
  towerShow(p.lvl);
  $('falt').textContent = fmtAlt(p.alt);
  $('fidx').textContent = String(i + 1).padStart(2, '0') + ' de ' + PANOS.length;
  document.title = p.title + ' \u2014 Lebensart Tour 360';
  stops.forEach((s, k) => s.setAttribute('aria-current', k === i ? 'true' : 'false'));
  $('railfill').style.top = posOf(i) + '%';
  $('railfill').style.bottom = '0%';

  const ready = texCache.has(i);
  if (!ready) $('spin').classList.add('on');

  load(i).then(t => {
    if (cur !== i) return;
    $('spin').classList.remove('on');
    if (!texA){ texA = t; texB = t; texAIdx = texBIdx = i; mix = 1; }
    else { texB = t; texBIdx = i; mix = 0; fading = true; }
    // nunca descarta o que esta ligado agora, mesmo com trocas em cima da transicao
    evict([i, prev, texAIdx, texBIdx, i-1, i+1]);
    // adianta os vizinhos para a troca ficar instant\u00e2nea
    [i+1, i-1].forEach(j => { if (PANOS[j] && !texCache.has(j)) load(j).catch(()=>{}); });
  }).catch(() => {
    $('spin').classList.remove('on');
  });
}

/* ---------------- intera\u00e7\u00e3o ---------------- */
let dragging = false, px = 0, py = 0, pinch = 0;

function markInteracted(){
  if (interacted) return;
  interacted = true;
  $('hint').classList.add('gone');
}

canvas.addEventListener('pointerdown', e => {
  dragging = true; px = e.clientX; py = e.clientY;
  canvas.classList.add('dragging');
  canvas.setPointerCapture(e.pointerId);
  markInteracted();
});
canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const k = fov / canvas.clientHeight * 1.15;
  // "puxar a cena": a imagem acompanha o dedo, entao a camera gira ao contrario
  yaw   += (e.clientX - px) * k;
  pitch += (e.clientY - py) * k;
  pitch = Math.max(-PITCH_MAX, Math.min(PITCH_MAX, pitch));
  px = e.clientX; py = e.clientY;
});
function endDrag(e){
  if (!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov + e.deltaY * 0.0013));
  markInteracted();
}, {passive:false});

canvas.addEventListener('touchmove', e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const d = Math.hypot(
    e.touches[0].clientX - e.touches[1].clientX,
    e.touches[0].clientY - e.touches[1].clientY);
  if (pinch) fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov * (pinch / d)));
  pinch = d;
}, {passive:false});
canvas.addEventListener('touchend', () => { pinch = 0; });

window.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp')        { go(cur + 1); e.preventDefault(); }
  else if (e.key === 'ArrowDown') { go(cur - 1); e.preventDefault(); }
  // setas giram a camera (seta esquerda olha para a esquerda), ao contrario do drag
  else if (e.key === 'ArrowLeft') { yaw += 0.09; markInteracted(); }
  else if (e.key === 'ArrowRight'){ yaw -= 0.09; markInteracted(); }
  else return;
});

$('btnRot').addEventListener('click', e => {
  autoRot = !autoRot;
  e.currentTarget.setAttribute('aria-pressed', String(autoRot));
  markInteracted();
});
$('btnFs').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else $('stage').requestFullscreen?.();
});

/* ---------------- in\u00edcio ---------------- */
$('bootbar').style.width = '18%';
load(0).then(() => {
  $('bootbar').style.width = '100%';
  go(0);            // go() assume a primeira textura e sincroniza t\u00edtulo e trilho
  requestAnimationFrame(frame);
  setTimeout(() => $('boot').classList.add('gone'), 320);
  setTimeout(() => { if (!interacted) $('hint').classList.add('gone'); }, 9000);
  load(1).catch(()=>{});
}).catch(() => {
  $('bootbar').style.background = '#B4472F';
});
</script>
